name: Trellis
description: >-
  Trellis (Trellis Research, Inc.) is an AI-powered state and federal trial court
  research and litigation analytics platform founded by former litigator Nicole
  Clark. It makes the fragmented U.S. state trial court system — plus federal,
  appellate, supreme, and bankruptcy courts via PACER — searchable through a
  single interface, and exposes that data programmatically through the Trellis
  Trial Court Data API. Law firms, financial institutions, insurers, and
  researchers use Trellis for case research, judge and ruling analytics, docket
  monitoring with alerts, document retrieval, business development, lead
  generation, and due diligence. API access (V2, adding federal + PACER on top of
  V1 state coverage) is provisioned through a sales-gated free trial.
